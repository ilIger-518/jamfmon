version: "3.9"

networks:
  jp_internal:
    driver: overlay
    attachable: true

volumes:
  pg_data:
  minio_data:

services:
  ingestion:
    image: jamfmon/ingestion:local
    networks: [jp_internal]
    secrets:
      - source: jp_postgres_password
        target: jp_postgres_password
      - source: jp_tenants_json_v3
        target: jp_tenants_json
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: jamf_monitor
      PGUSER: jamf
      INGEST_POLL_INTERVAL_SECONDS: "300"
      INGEST_ERROR_BACKOFF_BASE_SECONDS: "15"
      INGEST_ERROR_BACKOFF_MAX_SECONDS: "300"
      INGEST_HEALTH_MAX_STALE_SECONDS: "420"
    depends_on:
      - postgres
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  postgres:
    image: postgres:16-alpine
    networks: [jp_internal]
    environment:
      POSTGRES_DB: jamf_monitor
      POSTGRES_USER: jamf
      POSTGRES_PASSWORD_FILE: /run/secrets/jp_postgres_password
    secrets:
      - jp_postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    networks: [jp_internal]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/jp_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/jp_minio_root_password
    secrets:
      - jp_minio_root_user
      - jp_minio_root_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  metabase:
    image: metabase/metabase:latest
    networks: [jp_internal]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: jamf_monitor
      MB_DB_PORT: "5432"
      MB_DB_USER: jamf
      MB_DB_HOST: postgres
      MB_DB_PASS_FILE: /run/secrets/jp_postgres_password
      MB_ENCRYPTION_SECRET_KEY_FILE: /run/secrets/jp_metabase_secret_key
    secrets:
      - jp_postgres_password
      - jp_metabase_secret_key
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    deploy:
      replicas: 1

secrets:
  jp_postgres_password:
    external: true
  jp_minio_root_user:
    external: true
  jp_minio_root_password:
    external: true
  jp_metabase_secret_key:
    external: true
  jp_tenants_json_v3:
    external: true
